# Local development stack. Start everything with:
#   docker compose -f infrastructure/docker-compose.yml up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight"]
      interval: 5s
      retries: 10

  data-engine:
    build: ../services/data-engine
    environment:
      ENGINE_ENV: development
      # Must match ENGINE_API_KEY in apps/web/.env.local
      ENGINE_API_KEY: ${ENGINE_API_KEY:-dev-engine-key-change-me}
      ENGINE_MAX_UPLOAD_MB: "50"
      ENGINE_MAX_CONCURRENT_JOBS: "2"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - engine-data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # Calls the web app's scheduler endpoint every minute so workflows run on time.
  # The web app runs on your machine (npm run dev), reached via host.docker.internal.
  scheduler:
    image: curlimages/curl:8.10.1
    environment:
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret-change-me}
      APP_URL: ${APP_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do curl -s -o /dev/null -w "%{http_code}\n" -X POST -H "Authorization: Bearer $$CRON_SECRET" "$$APP_URL/api/cron/tick"; sleep 60; done'
    restart: unless-stopped

volumes:
  pgdata:
  engine-data:
